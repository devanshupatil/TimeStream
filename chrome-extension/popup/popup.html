<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
        :root {
            --bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --accent: #2bd4bd;
            --accent-hover: #1fbba4;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        body {
            width: 320px;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow: hidden;
        }

        .header {
            padding: 16px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .content {
            padding: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .control-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-icon {
            color: var(--accent);
        }

        .control-label {
            font-weight: 600;
            font-size: 13px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(18px);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .footer {
            padding: 12px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .sync-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">
                <span class="material-symbols-outlined" style="font-size: 16px">timeline</span>
            </div>
            TimeStream
        </div>
        <button id="btn-settings" style="background:none; border:none; cursor:pointer; color:var(--text-secondary)">
            <span class="material-symbols-outlined" style="font-size: 20px">settings</span>
        </button>
    </div>

    <div class="content">
        <div class="stat-card">
            <div class="stat-label">Logged Today</div>
            <div id="stat-count" class="stat-value">0</div>
        </div>

        <div class="controls">
            <div class="control-item">
                <div class="control-info">
                    <span class="material-symbols-outlined control-icon">monitoring</span>
                    <span class="control-label">Tracking Active</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-tracking" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <button id="btn-sync" class="btn-primary">
                <span class="material-symbols-outlined">sync</span>
                Sync with TimeStream
            </button>

            <div class="sync-status">
                <div class="status-dot"></div>
                <span id="sync-text">Up to date</span>
            </div>
        </div>
    </div>

    <div class="footer">
        v1.0.0 &bull; Oceanic Breeze Edition
    </div>

    <script type="module" src="popup.js"></script>
</body>

</html>
